version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vesper_backend
    ports:
      - "8000:8000"
    volumes:
      - ./v_2:/app/v_2:ro
      - ./backend:/app/backend
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vesper_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
